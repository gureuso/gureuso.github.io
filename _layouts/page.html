---
layout: default
---
<div class="container narrow stack">
  <article class="window page">
    {% include window-bar.html title=page.title %}
    <div class="win-body">
      <header class="page-head">
        <h1 class="page-title">{{ page.title }}</h1>
        {%- if page.subtitle %}<p class="page-sub">{{ page.subtitle }}</p>{% endif %}
      </header>
      <div class="prose">
        {{ content }}
      </div>
    </div>
  </article>
</div>
