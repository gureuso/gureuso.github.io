<div class="search" id="search" hidden>

  <div class="search-panel" role="dialog" aria-modal="true" aria-label="글 검색">
    <div class="search-field">
      {% include icon.html name='search' %}
      <input type="search" id="search-input" placeholder="제목, 태그, 카테고리로 검색" autocomplete="off">
      <kbd data-search-close>ESC</kbd>
    </div>
    <ul class="search-results" id="search-results"></ul>
  </div>
</div>
